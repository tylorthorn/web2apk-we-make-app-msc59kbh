plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.wemakeapp'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.wemakeapp'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}

dependencies {
    // Android system WebView only — no bundled rendering engine, hence the tiny (~5-8MB) APK.
    // TTS is provided via android.speech.tts.TextToSpeech, bridged into a
    // window.speechSynthesis polyfill through a @JavascriptInterface.
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
